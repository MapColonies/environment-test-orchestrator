apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sar.fullname" . }}-auth
  labels: {{- include "sar.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_USERNAME: {{ .Values.auth.username | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.password | quote }}
  SESSION_SECRET: {{ include "sar.sessionSecret" . | quote }}
  SUPABASE_URL: {{ .Values.supabase.url | quote }}
  SUPABASE_PUBLISHABLE_KEY: {{ .Values.supabase.publishableKey | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ .Values.supabase.serviceRoleKey | quote }}
