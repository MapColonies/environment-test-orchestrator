image:
  repository: acrarolibotnonprod.azurecr.io/automation/sanity-ui
  tag: v1.0.3
  pullPolicy: IfNotPresent

# Private registry pull secret. Create it first, e.g.:
#   oc create secret docker-registry acr-registry \
#     --docker-server=acrarolibotnonprod.azurecr.io \
#     --docker-username=<user> --docker-password=<password>
cloudProvider:
  dockerRegistryUrl: acrarolibotnonprod.azurecr.io
  imagePullSecretName: acr-registry
  flavor: openshift

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# OpenShift Route. Disable if you use an Ingress or a Service only.
route:
  enabled: true
  host: ""          # leave empty to let OpenShift assign one
  tls:
    enabled: true
    termination: edge

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Reports live here inside the container and are backed by the PVC below.
reportsDir: /data/reports

persistence:
  enabled: true
  size: 2Gi
  accessMode: ReadWriteOnce
  storageClass: ""        # "" -> cluster default
  # If you already created a PVC by hand, set its name here and it will be
  # used verbatim (no new PVC is provisioned).
  existingClaim: ""

# --- Admin login (change these!) --------------------------------------------
# These map to ADMIN_USERNAME / ADMIN_PASSWORD env vars in the pod.
auth:
  username: "admin"
  password: "admin"

# --- Session signing secret --------------------------------------------------
# Leave empty to auto-generate one on first install. The value is preserved
# across upgrades via the `lookup` helm function.
sessionSecret: ""

# --- Supabase ------------------------------------------------------------
# url/publishableKey: also baked into the client bundle at image build time
# (docker build --build-arg VITE_SUPABASE_URL=... --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=...).
# The values here just make them available to the server process at runtime.
# serviceRoleKey: server-only, never exposed to the client bundle. Get it from
# Supabase dashboard -> Settings -> API -> service_role secret.
supabase:
  url: ""
  publishableKey: ""
  serviceRoleKey: ""

# --- Agents ------------------------------------------------------------------
# Each agent needs only a base_url and its token. Catalog and CORS-test data
# are fetched live from the agent at that URL. Set `cors_targets` only if you
# need to override/curate the agent's own `/cors-test` response.
# If `agents` is empty the app runs in demo mode with mock data.
demoMode: false

agents:
  - id: qa
    name: QA
    base_url: https://sanity-agent-nginx-route-qa.apps.j1lk3njp.eastus.aroapp.io
    api_key: ""        # sent as x-api-key + Authorization: Bearer — set via my-values.secrets.yaml
  - id: int
    name: Integration
    base_url: https://sanity-agent-nginx-route-integration.apps.j1lk3njp.eastus.aroapp.io
    api_key: ""        # sent as x-api-key + Authorization: Bearer — set via my-values.secrets.yaml

# --- Pod-level knobs ---------------------------------------------------------
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}
